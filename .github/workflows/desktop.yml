name: Desktop (Windows x64)

on:
  push:
    branches: ["**"]
    tags: ["desktop-v*"]
    paths:
      - "desktop/**"
      - "src/sync/**"
      - "src/contents/**"
      - "locales/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "src/sync/**"
      - "src/contents/**"
      - "locales/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release (tag desktop-v<version>)"
        type: boolean
        default: true

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & end-to-end test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: End-to-end publish test
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          xvfb-run -a npm run e2e

  windows:
    name: Build Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --x64 --publish never
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path upload | Out-Null
          Get-ChildItem release -File | Where-Object { $_.Extension -in ".exe", ".zip", ".blockmap" } | Copy-Item -Destination upload
          Get-ChildItem upload
      - uses: actions/upload-artifact@v4
        with:
          name: MultiPost-Desktop-win-x64
          path: desktop/upload/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [test, windows]
    if: startsWith(github.ref, 'refs/tags/desktop-v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: MultiPost-Desktop-win-x64
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('desktop-v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: MultiPost Desktop ${{ steps.version.outputs.version }} (Windows x64)
          generate_release_notes: true
          body: |
            MultiPost Desktop for Windows 10/11 (64-bit).

            - `MultiPost-Desktop-Setup-*-x64.exe`: installer (recommended)
            - `MultiPost-Desktop-*-x64-portable.exe`: portable, no install
            - `MultiPost-Desktop-*-win-x64.zip`: unpacked app

            The app is not code-signed yet. Windows SmartScreen may warn on first launch: choose "More info" → "Run anyway".
          files: artifacts/*
          fail_on_unmatched_files: true
